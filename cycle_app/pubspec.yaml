name: cycle_aura
description: "Lune — private menstrual cycle tracker with AI wellness assistant."
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  menstrual_cycle_widget:
    path: ../menstrual_cycle_widget-master

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.3.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  go_router: ^15.1.2
  google_fonts: ^6.3.2
  http: ^1.4.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  crypto: ^3.0.6
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  provider: ^6.1.5+1
  firebase_ai: ^2.3.0
  google_generative_ai: ^0.4.7
  flutter_timezone: ^5.0.0
  share_plus: ^12.0.0
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  sqflite: ^2.3.3+1
  path: ^1.9.1
  collection: ^1.19.1
  dynamic_color: ^1.8.1
  fl_chart: ^1.0.0
  flutter_colorpicker: ^1.1.0
  local_auth: ^3.0.0
  package_info_plus: ^9.0.0
  home_widget: ^0.6.0
  watch_connectivity: ^0.2.4
  scrollable_clean_calendar: ^1.5.0
  age_calculator: ^1.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  firebase_storage: ^12.4.5
  video_player: ^2.9.5
  in_app_purchase: ^3.2.3
  firebase_crashlytics: ^4.3.5
  firebase_app_check: ^0.3.2+5
  sign_in_with_apple: ^7.0.1
  firebase_messaging: ^15.2.5
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#E8A0BF"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
