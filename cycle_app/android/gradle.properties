# -Duser.language/-Duser.country work around a bundletool bug that names dex
# files with localized digits (e.g. Arabic numerals) and breaks bundleRelease.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
