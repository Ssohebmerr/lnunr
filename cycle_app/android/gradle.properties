# -Duser.language/-Duser.country work around a bundletool bug that names dex
# files with localized digits (e.g. Arabic numerals) and breaks bundleRelease.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
