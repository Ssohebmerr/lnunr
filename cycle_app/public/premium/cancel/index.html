<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تم إلغاء الدفع — Lune</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(135deg, #FADADD 0%, #FFFBF8 45%, #D4C4F0 100%);
    color: #5C3D52; text-align: center; padding: 24px;
  }
  .icon {
    width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 20px;
    background: #C9B8E8; display: grid; place-items: center;
    font-size: 42px; color: #fff; box-shadow: 0 10px 30px rgba(201, 184, 232, 0.5);
  }
  h1 { font-size: 26px; margin-bottom: 10px; }
  p { color: #8B6B7A; font-size: 15px; max-width: 420px; margin: 0 auto; line-height: 1.7; }
</style>
</head>
<body>
<div>
  <div class="icon">✕</div>
  <h1>تم إلغاء عملية الدفع</h1>
  <p>لم يتم خصم أي مبلغ. يمكنك المحاولة مرة أخرى من التطبيق متى شئت 💕</p>
</div>
</body>
</html>
