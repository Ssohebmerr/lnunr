name: menstrual_cycle_widget
description: "The 'Menstrual Cycle Widget' Widget is a comprehensive and customizable widget designed to help users to show their menstrual cycles seamlessly."
version: 4.0.0
repository: https://github.com/sandipkalola/menstrual_cycle_widget
issue_tracker: https://github.com/sandipkalola/menstrual_cycle_widget/issues
funding:
  - https://github.com/sponsors/sandipkalola

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.2
  encrypt: ^5.0.3
  crypto: ^3.0.7
  http: ^1.6.0
  syncfusion_flutter_charts: ^32.1.19
  syncfusion_flutter_pdf: ^32.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.3


flutter:
  assets:
    - assets/images/

# This package supports all platforms listed below.
platforms:
  android:
  ios:

topics:
  - menstrualcycle
  - calenderview
  - period
  - health
  - menstruation
